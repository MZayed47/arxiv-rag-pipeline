services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arxiv-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-arxiv_db}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-arxiv_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: arxiv-api
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-shot ingestion runner:
  #   docker compose run --rm ingest
  #   docker compose run --rm ingest python -m ingestion.run_ingestion reset --yes
  ingest:
    build: .
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "ingestion.run_ingestion", "ingest"]

volumes:
  pgdata:
  hf_cache:
